name: YPOAI collector lanes

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane code (W1..W6) or 'all'"
        default: "all"
      minutes:
        description: "Run length per lane in minutes"
        default: "20"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [W1, W2, W3, W4, W5, W6]
    concurrency:
      group: ypoai-lane-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lane worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is not set; nothing to do."
            exit 0
          fi
          MIN="${{ github.event.inputs.minutes || '20' }}"
          python scripts/worker.py start --lane ${{ matrix.lane }} --hours "$(python -c "print($MIN/60)")"
