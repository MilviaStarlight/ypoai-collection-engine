name: YPOAI collector lanes

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane code (W1..W6) or 'all'"
        default: "all"
      minutes:
        description: "Run length per lane in minutes"
        default: "20"
  schedule:
    - cron: "4,19,34,49 * * * *"   # off the quarter-hour marks, which GitHub delays most

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [W1, W2, W3, W4, W5, W6]
    concurrency:
      group: ypoai-lane-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lane worker
        id: worker
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.lane == 'all' || github.event.inputs.lane == matrix.lane }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is not set; nothing to do."
            exit 0
          fi
          MIN="${{ github.event.inputs.minutes || '20' }}"
          python scripts/worker.py start --lane ${{ matrix.lane }} --hours "$(python -c "print($MIN/60)")"

      # Self-chaining: GitHub's cron is unreliable, so each lane run starts the next one for the same lane.
      # Needs repository secret ACTIONS_DISPATCH_TOKEN (fine-grained PAT, Actions: read/write on this repo).
      # Kill switch: set repository variable LANES_ENABLED to "false" to stop the chain.
      - name: Chain next run for this lane
        if: ${{ always() && steps.worker.outcome != 'skipped' && vars.LANES_ENABLED != 'false' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
          LANE: ${{ matrix.lane }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "ACTIONS_DISPATCH_TOKEN not set; not chaining (GitHub cron only)."
            exit 0
          fi
          sleep 20
          code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST             -H "Authorization: Bearer $DISPATCH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/workflows/collector-lanes.yml/dispatches"             -d "{\"ref\":\"main\",\"inputs\":{\"lane\":\"$LANE\",\"minutes\":\"20\"}}")
          echo "dispatch for $LANE -> HTTP $code"; cat /tmp/dispatch.out || true
          [ "$code" = "204" ]
