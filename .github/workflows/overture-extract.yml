name: YPOAI Overture places extract

# Second free business source next to OpenStreetMap. One job per state reads only the Overture Maps
# places rows inside the state's bounding box from the public S3 bucket, maps categories, assigns
# counties, and records through the same dedupe path. Manual only until the owner turns on a schedule.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes (e.g. PR or FL,VA) or 'launch' for the 9 PostMyPrice states"
        default: "PR"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.s.outputs.states }}
    steps:
      - id: s
        env:
          INPUT: ${{ github.event.inputs.states || 'PR' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          launch = "PR FL VA NY NJ MO MN OR WA".split()
          all_states = launch + "AL AK AZ AR CA CO CT DE DC GA HI ID IL IN IA KS KY LA ME MD MA MI MS MT NE NV NH NM NC ND OH OK PA RI SC SD TN TX UT VT WV WI WY".split()
          raw = os.environ["INPUT"].strip().upper()
          states = launch if raw == "LAUNCH" else all_states if raw == "ALL" else [s.strip() for s in raw.split(",") if s.strip() in all_states]
          print("states=" + json.dumps(states))
          PY

  extract:
    needs: plan
    if: ${{ needs.plan.outputs.states != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    concurrency:
      group: ypoai-overture-${{ matrix.state }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install -q -r requirements.txt
      - name: Extract ${{ matrix.state }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/overture_extract.py --state ${{ matrix.state }}
