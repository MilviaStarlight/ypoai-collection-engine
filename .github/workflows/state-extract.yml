name: YPOAI statewide extract

# One job per state: download the state's OpenStreetMap extract from Geofabrik once, extract every
# business for all categories and counties, record in Supabase, close the state's cells.
# No per-request calls to public map servers. Politeness: at most 2 states in parallel, which also keeps the database load low.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes (e.g. OH,MI) or 'all'"
        default: "all"
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours: one of six rotating state groups, so every state daily (launch states + PR first)

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.s.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.states }}
        run: python3 scripts/plan_states.py >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    if: ${{ needs.plan.outputs.states != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    concurrency:
      group: ypoai-extract-${{ matrix.state }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q -r requirements.txt
      - name: Extract ${{ matrix.state }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/state_extract.py --state ${{ matrix.state }}
